name: Update Age in README

on:
  schedule:
    - cron: '0 0 2 12 *'   # December 2 at midnight UTC
    - cron: '0 0 3 12 *'   # December 3 at midnight UTC (fallback)
  workflow_dispatch:         # Allow manual runs for testing

jobs:
  update-age:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate and update age
        run: |
          BIRTH_YEAR=2001
          CURRENT_YEAR=$(date +%Y)
          AGE=$((CURRENT_YEAR - BIRTH_YEAR))

          sed -i "s/^\* age: [0-9]\+/* age: ${AGE}/" README.md

          echo "AGE=${AGE}" >> "$GITHUB_ENV"
          echo "Updated age to ${AGE}"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add README.md
            git commit -m "chore: update age to ${AGE}"
            git push
          fi
